name: Build Ubuntu Debian Packages

on:
  workflow_dispatch:
  release:
    types: [created]

jobs:
  build-ubuntu-deb:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Python environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Step 3: Install system dependencies
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libssl-dev \
            libffi-dev \
            python3-dev \
            libxml2-dev \
            libxslt1-dev \
            zlib1g-dev \
            libjpeg-dev \
            libpng-dev \
            libfreetype6-dev \
            liblcms2-dev \
            libwebp-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libxcb1-dev \
            debhelper \
            dh-python \
            python3-stdeb

      # Step 4: Install uv
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      # Step 5: Install dependencies
      - name: Install dependencies with uv
        run: |
          rm -f uv.lock
          uv sync --no-dev

      # Step 6: Install UPX for compression
      - name: Install UPX
        run: |
          sudo apt-get install -y upx-ucl

      # Step 7: Build Debian packages
      - name: Build Debian packages
        run: |
          chmod +x tools/build_deb.sh
          ./tools/build_deb.sh

      # Step 8: Get application version
      - name: Get application version
        id: get_version
        run: |
          VERSION=$(python -c "import collabtrans; print(collabtrans.__version__)")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # Step 9: Upload Debian packages
      - name: Upload Debian packages
        uses: actions/upload-artifact@v4
        with:
          name: CollabTrans-Debian-Packages
          path: |
            build/deb/collabtrans_*.deb
            build/deb/collabtrans-full_*.deb
