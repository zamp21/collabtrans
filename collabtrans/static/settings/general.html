<div class="border rounded p-4">
  <div class="row g-3">
    <div class="col-md-6">
      <label class="form-label" for="defaultLanguage" data-i18n="defaultLanguageLabel">Default Language</label>
      <select id="defaultLanguage" class="form-select">
        <option value="en" data-i18n="languageEnglish">English</option>
        <option value="zh" data-i18n="languageChinese">Chinese</option>
      </select>
      <div class="form-text" data-i18n="defaultLanguageHelp">Set the default interface language for users, which can be changed in the navigation bar.</div>
    </div>
  </div>

  <!-- <span data-i18n="superAdminConfig">Super Admin Configuration</span> -->
  <div class="mt-4">
    <h6 class="mb-3" data-i18n="superAdminConfigTitle">Super Admin Configuration</h6>
    <div class="row g-3">
      <div class="col-md-6">
        <label for="defaultUsernameInput" class="form-label" data-i18n="defaultUsernameLabel">Default Username</label>
        <input type="text" class="form-control" id="defaultUsernameInput" 
               data-i18n-placeholder="defaultUsernamePlaceholder" placeholder="admin">
        <div class="form-text" data-i18n="defaultUsernameHelp">Username for the system default administrator</div>
      </div>
      <div class="col-md-6">
        <label for="defaultPasswordInput" class="form-label" data-i18n="defaultPasswordLabel">Default Password</label>
        <div class="input-group">
          <input type="password" class="form-control" id="defaultPasswordInput" 
                 data-i18n-placeholder="defaultPasswordPlaceholder" placeholder="********">
          <button class="btn btn-outline-secondary toggle-password" type="button" 
                  data-target="defaultPasswordInput">
            <i class="bi bi-eye"></i>
          </button>
        </div>
        <div class="form-text" data-i18n="defaultPasswordHelp">System default administrator password</div>
      </div>
    </div>
  </div>
  
  <div class="mt-4 d-flex gap-2">
    <button id="saveGeneralBtn" type="button" class="btn btn-outline-secondary" data-i18n="saveGeneralSettingsBtn">Save General Settings</button>
  </div>
</div>
