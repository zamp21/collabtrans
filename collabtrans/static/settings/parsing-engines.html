<div class="border rounded p-4">
  <div class="row g-3 align-items-end">
    <div class="col-md-6">
      <label class="form-label" for="engineSelect" data-i18n="currentEngineLabel">Current Engine</label>
      <select id="engineSelect" class="form-select"></select>
    </div>
    <div class="col-md-6">
      <label class="form-label" for="engineName" data-i18n="displayNameLabel">Display Name</label>
      <input type="text" class="form-control" id="engineName" data-i18n-placeholder="mineruPlaceholder" placeholder="MinerU">
    </div>
  </div>

  <div class="row g-3 mt-1">
    <div class="col-md-6" id="engineApiUrlRow" style="display:none;">
      <label class="form-label" for="engineApiUrl" data-i18n="apiUrlLabel">API URL</label>
      <input type="url" class="form-control" id="engineApiUrl" data-i18n-placeholder="apiUrlPlaceholder" placeholder="https://...">
      <div class="form-text" data-i18n="apiUrlHelp">Remote/HTTP engines (like MinerU) require API URL configuration.</div>
    </div>
    <div class="col-md-6" id="mineruModelRow" style="display:none;">
      <label class="form-label" for="mineruModelVersion" data-i18n="mineruModelVersionLabel">MinerU Model Version</label>
      <input type="text" class="form-control" id="mineruModelVersion" data-i18n-placeholder="mineruModelVersionPlaceholder" placeholder="vlm">
    </div>
  </div>

  <div class="row g-3 mt-1" id="mineruApiKeyRow" style="display:none;">
    <div class="col-md-12">
      <div class="d-flex align-items-center mb-2">
        <label class="form-label mb-0" for="mineruApiKey" data-i18n="mineruApiKeyLabel">MinerU API Key</label>
        <a href="https://mineru.net/apiManage/token" target="_blank" class="ms-2 text-primary" data-i18n-title="getMineruTokenTitle" title="获取MinerU Token" style="text-decoration: none; font-size: 0.9em;">
          <i class="bi bi-box-arrow-up-right me-1"></i><span data-i18n="getMineruTokenText">申请/查看Token</span>
        </a>
      </div>
      <span id="mineruApiKeyStatus" class="badge bg-secondary ms-2" data-i18n="statusNotConfigured">未配置</span>
      <div class="input-group">
        <input type="password" class="form-control" id="mineruApiKey" data-i18n-placeholder="mineruApiKeyPlaceholder" placeholder="sk-...">
        <button class="btn btn-outline-secondary toggle-password" type="button" data-target="mineruApiKey">
          <i class="bi bi-eye"></i>
        </button>
      </div>
      <div class="form-text" data-i18n="mineruApiKeyHelp">仅用于 MinerU 解析引擎，安全保存于服务器。</div>
    </div>
  </div>

  <div class="mt-4 d-flex gap-2">
    <button id="saveEngineBtn" type="button" class="btn btn-outline-secondary" data-i18n="saveEngineSettingsBtn">保存 Engine 设置</button>
  </div>
</div>
