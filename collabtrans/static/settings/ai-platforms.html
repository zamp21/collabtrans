<div class="border rounded p-4">
  <div class="mb-3">
    <label class="form-label" for="platformSelect" data-i18n="currentPlatformLabel">Current Platform</label>
    <select id="platformSelect" class="form-select">
      <!-- Options will be dynamically loaded from configuration file -->
    </select>
  </div>

  <div class="row g-3">
    <div class="col-md-6">
      <label class="form-label" for="platformName" data-i18n="platformNameLabel">Platform Name</label>
      <input type="text" class="form-control" id="platformName" data-i18n-placeholder="deepseekPlaceholder" placeholder="DeepSeek">
    </div>
    <div class="col-md-6">
      <label class="form-label" for="platformUrl" data-i18n="platformUrlLabel">Platform URL</label>
      <input type="url" class="form-control" id="platformUrl" data-i18n-placeholder="platformUrlPlaceholder" placeholder="https://api.deepseek.com">
    </div>
  </div>

  <div class="mt-3">
    <label class="form-label" for="platformApiKey" data-i18n="apiKeyLabel">API Key</label>
    <span id="platformApiKeyStatus" class="badge bg-secondary ms-2" data-i18n="statusNotConfigured">Not configured</span>
    <div class="input-group">
      <input type="password" class="form-control" id="platformApiKey" data-i18n-placeholder="apiKeyPlaceholder" placeholder="sk-...">
      <button class="btn btn-outline-secondary toggle-password" type="button" data-target="platformApiKey">
        <i class="bi bi-eye"></i>
      </button>
    </div>
    <div class="form-text" data-i18n="apiKeyHelp">API Key will be securely saved and not displayed in plain text</div>
  </div>

  <div class="mt-3">
    <label class="form-label" for="modelName" data-i18n="modelNameLabel">Model Name</label>
    <input type="text" class="form-control" id="modelName" data-i18n-placeholder="modelNamePlaceholder" placeholder="deepseek-chat">
    <div class="form-text" data-i18n="modelNameHelp">e.g.: deepseek-chat, gpt-4, claude-3-sonnet, etc.</div>
  </div>

  <div class="mt-3">
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label" for="maxTokens" data-i18n="maxTokensLabel">Max Tokens</label>
        <input type="number" class="form-control" id="maxTokens" data-i18n-placeholder="maxTokensPlaceholder" placeholder="4096" min="1" max="100000">
      </div>
      <div class="col-md-6">
        <label class="form-label" for="temperature" data-i18n="temperatureLabel">Temperature</label>
        <input type="number" class="form-control" id="temperature" data-i18n-placeholder="temperaturePlaceholder" placeholder="0.7" min="0" max="2" step="0.1">
      </div>
    </div>
  </div>

  <div class="mt-3">
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label" for="recommendedTokens" data-i18n="recommendedTokensLabel">Recommended Tokens</label>
        <input type="number" class="form-control" id="recommendedTokens" data-i18n-placeholder="recommendedTokensPlaceholder" placeholder="4000" min="1" max="100000">
        <div class="form-text" data-i18n="recommendedTokensHelp">Recommended token count for performance optimization</div>
      </div>
      <div class="col-md-6">
        <label class="form-label" for="performanceNote" data-i18n="performanceNoteLabel">Performance Note</label>
        <input type="text" class="form-control" id="performanceNote" data-i18n-placeholder="performanceNotePlaceholder" placeholder="Performance characteristics">
        <div class="form-text" data-i18n="performanceNoteHelp">Performance characteristics or usage recommendations for this platform</div>
      </div>
    </div>
  </div>

  <div class="mt-4 d-flex gap-2">
    <button id="saveAiPlatformBtn" type="button" class="btn btn-outline-secondary" data-i18n="saveAiPlatformSettingsBtn">Save AI Platform Settings</button>
    <button id="testAiPlatformBtn" type="button" class="btn btn-outline-secondary" data-i18n="testConnectionBtn">Test Connection</button>
  </div>
</div>
