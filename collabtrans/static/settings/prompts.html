<div class="ct-section-card rounded p-4">
  <div class="row g-3">
    
    <!-- <span data-i18n="addNewPrompt">Add New Prompt</span> -->
    <div class="col-12">
      <h5 class="mb-3" data-i18n="addNewPromptTitle">Add New Prompt</h5>
      <form id="addPromptForm">
        <div class="row">
          <div class="col-md-4">
            <div class="mb-3">
              <label for="newPromptDescription" class="form-label" data-i18n="promptDescriptionLabel">Prompt Description</label>
              <input type="text" class="form-control" id="newPromptDescription" required>
            </div>
          </div>
          <div class="col-md-8">
            <div class="mb-3">
              <label for="newPromptText" class="form-label" data-i18n="promptTextLabel">Prompt Text</label>
              <textarea class="form-control" id="newPromptText" rows="2" required></textarea>
            </div>
          </div>
        </div>
        <button type="submit" class="btn btn-primary" data-i18n="addPromptBtn">Add Prompt</button>
      </form>
    </div>
    
    <hr class="my-4">
    
    <!-- <span data-i18n="promptList">Prompt List</span> -->
    <div class="col-12">
      <h5 class="mb-3" data-i18n="promptListTitle">Prompt List</h5>
      <div id="promptList" class="ct-section-card rounded p-3" style="max-height: 400px; overflow-y: auto;">
        <p class="text-muted mb-0" data-i18n="loadingPrompts">Loading...</p>
      </div>
    </div>

  </div>
</div>
