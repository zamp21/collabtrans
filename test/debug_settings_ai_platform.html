<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Settings AI Platform</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .debug-section { margin: 20px 0; padding: 15px; border: 1px solid #ccc; }
        .error { color: red; }
        .success { color: green; }
        .info { color: blue; }
    </style>
</head>
<body>
    <h1>Settings AI Platform 调试页面</h1>
    
    <div class="debug-section">
        <h2>1. 测试后端API</h2>
        <button onclick="testBackendAPI()">测试 /auth/app-config</button>
        <div id="backend-result"></div>
    </div>
    
    <div class="debug-section">
        <h2>2. 测试AI Platform模块加载</h2>
        <button onclick="testAIPlatformModule()">测试AI Platform模块</button>
        <div id="module-result"></div>
    </div>
    
    <div class="debug-section">
        <h2>3. 测试Settings页面</h2>
        <button onclick="testSettingsPage()">测试Settings页面</button>
        <div id="settings-result"></div>
    </div>
    
    <div class="debug-section">
        <h2>4. 控制台日志</h2>
        <div id="console-log"></div>
    </div>

    <script>
        // 捕获控制台日志
        const originalLog = console.log;
        const originalError = console.error;
        const logContainer = document.getElementById('console-log');
        
        function addLog(message, type = 'info') {
            const div = document.createElement('div');
            div.className = type;
            div.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logContainer.appendChild(div);
        }
        
        console.log = function(...args) {
            originalLog.apply(console, args);
            addLog(args.join(' '), 'info');
        };
        
        console.error = function(...args) {
            originalError.apply(console, args);
            addLog(args.join(' '), 'error');
        };
        
        async function testBackendAPI() {
            const resultDiv = document.getElementById('backend-result');
            resultDiv.innerHTML = '<div class="info">测试中...</div>';
            
            try {
                const response = await fetch('/auth/app-config');
                if (response.ok) {
                    const config = await response.json();
                    const aiPlatforms = config.ai_platforms || {};
                    resultDiv.innerHTML = `
                        <div class="success">✅ API响应成功: ${response.status}</div>
                        <div class="info">📊 AI平台配置数量: ${Object.keys(aiPlatforms).length}</div>
                        <div class="info">📋 平台列表: ${Object.keys(aiPlatforms).join(', ')}</div>
                    `;
                } else {
                    resultDiv.innerHTML = `<div class="error">❌ API响应失败: ${response.status}</div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="error">❌ API测试失败: ${error.message}</div>`;
            }
        }
        
        async function testAIPlatformModule() {
            const resultDiv = document.getElementById('module-result');
            resultDiv.innerHTML = '<div class="info">测试中...</div>';
            
            try {
                // 测试模块文件是否存在
                const response = await fetch('/static/settings/ai-platforms.js');
                if (response.ok) {
                    resultDiv.innerHTML = `
                        <div class="success">✅ AI Platform模块文件存在</div>
                        <div class="info">📄 文件大小: ${response.headers.get('content-length')} bytes</div>
                    `;
                } else {
                    resultDiv.innerHTML = `<div class="error">❌ AI Platform模块文件不存在: ${response.status}</div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="error">❌ 模块测试失败: ${error.message}</div>`;
            }
        }
        
        async function testSettingsPage() {
            const resultDiv = document.getElementById('settings-result');
            resultDiv.innerHTML = '<div class="info">测试中...</div>';
            
            try {
                const response = await fetch('/settings');
                if (response.ok) {
                    const html = await response.text();
                    if (html.includes('ai-platforms')) {
                        resultDiv.innerHTML = `
                            <div class="success">✅ Settings页面加载成功</div>
                            <div class="success">✅ 找到AI Platform模块引用</div>
                        `;
                    } else {
                        resultDiv.innerHTML = `
                            <div class="success">✅ Settings页面加载成功</div>
                            <div class="error">❌ 未找到AI Platform模块引用</div>
                        `;
                    }
                } else {
                    resultDiv.innerHTML = `<div class="error">❌ Settings页面加载失败: ${response.status}</div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="error">❌ Settings页面测试失败: ${error.message}</div>`;
            }
        }
        
        // 页面加载时自动运行测试
        window.addEventListener('load', () => {
            console.log('调试页面加载完成');
            testBackendAPI();
            testAIPlatformModule();
            testSettingsPage();
        });
    </script>
</body>
</html>
