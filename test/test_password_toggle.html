<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Toggle Test</title>
    <link href="/static/bootstrap.css" rel="stylesheet">
    <link href="/static/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ccc; }
        .debug-info { background: #f5f5f5; padding: 10px; margin: 10px 0; font-family: monospace; }
    </style>
</head>
<body>
    <h1>密码切换按钮测试</h1>
    
    <div class="test-section">
        <h2>测试密码切换按钮</h2>
        <div class="mb-3">
            <label class="form-label" for="testPassword">测试密码输入框</label>
            <div class="input-group">
                <input type="password" class="form-control" id="testPassword" placeholder="输入密码">
                <button class="btn btn-outline-secondary toggle-password" type="button" data-target="testPassword">
                    <i class="bi bi-eye"></i>
                </button>
            </div>
        </div>
        
        <div class="mb-3">
            <label class="form-label" for="platformApiKey">API Key输入框（模拟AI Platform）</label>
            <div class="input-group">
                <input type="password" class="form-control" id="platformApiKey" placeholder="sk-..." value="sk-1234567890***">
                <button class="btn btn-outline-secondary toggle-password" type="button" data-target="platformApiKey">
                    <i class="bi bi-eye"></i>
                </button>
            </div>
        </div>
    </div>
    
    <div class="test-section">
        <h2>调试信息</h2>
        <div id="debug-log"></div>
    </div>

    <script>
        function addLog(message, type = 'info') {
            const div = document.getElementById('debug-log');
            const p = document.createElement('p');
            p.className = type;
            p.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            div.appendChild(p);
        }
        
        // 复制settings-core.js中的initTogglePasswordButtons函数
        function initTogglePasswordButtons() {
            addLog('开始初始化密码切换按钮');
            const toggleButtons = document.querySelectorAll('.toggle-password');
            addLog(`找到 ${toggleButtons.length} 个密码切换按钮`);
            
            toggleButtons.forEach((button, index) => {
                const targetId = button.getAttribute('data-target');
                const passwordInput = document.getElementById(targetId);
                const icon = button.querySelector('i');

                addLog(`按钮 ${index}: target=${targetId}, input存在=${!!passwordInput}, icon存在=${!!icon}`);

                if (!passwordInput || !icon) {
                    addLog(`按钮 ${index} 缺少target或icon`, 'error');
                    return;
                }

                button.addEventListener('click', async () => {
                    addLog(`密码切换按钮被点击: ${targetId}`);
                    if (passwordInput.type === 'password') {
                        passwordInput.type = 'text';
                        icon.classList.remove('bi-eye-slash');
                        icon.classList.add('bi-eye');
                        addLog(`显示密码: ${targetId}`);
                    } else {
                        passwordInput.type = 'password';
                        icon.classList.remove('bi-eye');
                        icon.classList.add('bi-eye-slash');
                        addLog(`隐藏密码: ${targetId}`);
                    }
                });
                
                addLog(`按钮 ${index} 事件监听器已添加`);
            });
        }
        
        // 页面加载时初始化
        window.addEventListener('load', () => {
            addLog('页面加载完成');
            initTogglePasswordButtons();
        });
    </script>
</body>
</html>
