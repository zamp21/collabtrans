<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check Settings Content</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .result { margin: 10px 0; padding: 10px; border: 1px solid #ccc; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
        .debug { background: #f8f9fa; color: #495057; font-family: monospace; white-space: pre-wrap; }
    </style>
</head>
<body>
    <h1>Settings页面内容检查</h1>
    <div id="results"></div>

    <script>
        async function checkSettingsContent() {
            const resultsDiv = document.getElementById('results');
            
            try {
                const response = await fetch('/settings');
                if (response.ok) {
                    const html = await response.text();
                    
                    // 检查AI Platform相关元素
                    const checks = [
                        {
                            name: 'AI Platform导航链接',
                            test: () => html.includes('data-section="ai-platforms"'),
                            search: 'data-section="ai-platforms"'
                        },
                        {
                            name: 'AI Platform模块区域',
                            test: () => html.includes('id="ai-platforms-section"'),
                            search: 'id="ai-platforms-section"'
                        },
                        {
                            name: 'AI Platform标题',
                            test: () => html.includes('AI 平台'),
                            search: 'AI 平台'
                        },
                        {
                            name: 'AI Platform描述',
                            test: () => html.includes('配置AI翻译平台的API密钥和参数'),
                            search: '配置AI翻译平台的API密钥和参数'
                        },
                        {
                            name: 'General模块active类',
                            test: () => html.includes('class="settings-section active"'),
                            search: 'class="settings-section active"'
                        }
                    ];
                    
                    let results = '<h2>检查结果:</h2>';
                    
                    checks.forEach(check => {
                        const found = check.test();
                        const className = found ? 'success' : 'error';
                        const status = found ? '✅ 找到' : '❌ 未找到';
                        
                        results += `
                            <div class="result ${className}">
                                <strong>${check.name}:</strong> ${status}
                                <br><small>搜索内容: "${check.search}"</small>
                            </div>
                        `;
                    });
                    
                    // 显示HTML片段
                    results += '<h2>HTML片段:</h2>';
                    results += '<div class="result debug">';
                    
                    // 查找AI Platform相关的HTML片段
                    const lines = html.split('\n');
                    const relevantLines = [];
                    
                    lines.forEach((line, index) => {
                        if (line.includes('ai-platforms') || line.includes('AI 平台') || line.includes('settings-section')) {
                            relevantLines.push(`Line ${index + 1}: ${line.trim()}`);
                        }
                    });
                    
                    if (relevantLines.length > 0) {
                        results += relevantLines.join('\n');
                    } else {
                        results += '未找到相关HTML片段';
                    }
                    
                    results += '</div>';
                    
                    resultsDiv.innerHTML = results;
                } else {
                    resultsDiv.innerHTML = `<div class="result error">❌ Settings页面加载失败: ${response.status}</div>`;
                }
            } catch (error) {
                resultsDiv.innerHTML = `<div class="result error">❌ 检查失败: ${error.message}</div>`;
            }
        }
        
        // 页面加载时自动运行检查
        window.addEventListener('load', checkSettingsContent);
    </script>
</body>
</html>
