<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>密码切换按钮简单测试</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ccc; }
        .debug-info { background: #f5f5f5; padding: 10px; margin: 10px 0; font-family: monospace; }
    </style>
</head>
<body>
    <h1>密码切换按钮简单测试</h1>
    
    <div class="test-section">
        <h2>测试1: 基本密码切换</h2>
        <div class="input-group">
            <input type="password" class="form-control" id="testPassword" value="test123456">
            <button class="btn btn-outline-secondary toggle-password" type="button" data-target="testPassword">
                <i class="bi bi-eye-slash"></i>
            </button>
        </div>
        <div class="debug-info" id="test1-log"></div>
    </div>
    
    <div class="test-section">
        <h2>测试2: API Key切换（模拟）</h2>
        <div class="input-group">
            <input type="password" class="form-control" id="testApiKey" value="sk-12345678***">
            <button class="btn btn-outline-secondary toggle-password" type="button" data-target="testApiKey">
                <i class="bi bi-eye-slash"></i>
            </button>
        </div>
        <div class="debug-info" id="test2-log"></div>
    </div>
    
    <div class="test-section">
        <h2>测试3: 真实API Key切换</h2>
        <div class="input-group">
            <input type="password" class="form-control" id="realApiKey" value="sk-12345678***">
            <button class="btn btn-outline-secondary toggle-password" type="button" data-target="realApiKey">
                <i class="bi bi-eye-slash"></i>
            </button>
        </div>
        <div class="debug-info" id="test3-log"></div>
    </div>

    <script>
        // 模拟SettingsCore的initTogglePasswordButtons函数
        function initTogglePasswordButtons() {
            console.log('[DEBUG] initTogglePasswordButtons - starting initialization');
            const toggleButtons = document.querySelectorAll('.toggle-password');
            console.log('[DEBUG] initTogglePasswordButtons - found toggle buttons:', toggleButtons.length);
            
            toggleButtons.forEach((button, index) => {
                const targetId = button.getAttribute('data-target');
                const passwordInput = document.getElementById(targetId);
                const icon = button.querySelector('i');

                console.log(`[DEBUG] initTogglePasswordButtons - button ${index}: target=${targetId}, input exists=${!!passwordInput}, icon exists=${!!icon}`);

                if (!passwordInput || !icon) {
                    console.warn(`[DEBUG] initTogglePasswordButtons - button ${index} missing target or icon`);
                    return;
                }

                button.addEventListener('click', async () => {
                    console.log(`[DEBUG] toggle-password button clicked for target: ${targetId}`);
                    const logDiv = document.getElementById(`${targetId}-log`);
                    
                    if (passwordInput.type === 'password') {
                        passwordInput.type = 'text';
                        icon.classList.remove('bi-eye-slash');
                        icon.classList.add('bi-eye');
                        
                        if (targetId === 'realApiKey' && passwordInput.value && passwordInput.value.includes('***')) {
                            console.log(`[DEBUG] Detected masked API key, fetching real key`);
                            console.log(`[DEBUG] Current masked value: "${passwordInput.value}"`);
                            
                            try {
                                const resp = await fetch('/auth/app-config/raw-secrets');
                                if (resp.ok) {
                                    const secrets = await resp.json();
                                    console.log(`[DEBUG] Raw secrets response:`, secrets);
                                    
                                    const apiKey = secrets.platform_api_keys?.['deepseek'];
                                    if (apiKey) {
                                        console.log(`[DEBUG] Found API key, length: ${apiKey.length}`);
                                        passwordInput.value = apiKey;
                                        console.log(`[DEBUG] Real API key loaded`);
                                        logDiv.innerHTML = `✅ 真实API Key已加载，长度: ${apiKey.length}`;
                                    } else {
                                        console.log(`[DEBUG] No API key found`);
                                        logDiv.innerHTML = `⚠️ 未找到API Key`;
                                    }
                                } else {
                                    console.error(`[DEBUG] Failed to fetch raw secrets: ${resp.status}`);
                                    logDiv.innerHTML = `❌ 获取失败: ${resp.status}`;
                                }
                            } catch (error) {
                                console.error('[DEBUG] Error fetching raw API key:', error);
                                logDiv.innerHTML = `❌ 错误: ${error.message}`;
                            }
                        } else {
                            logDiv.innerHTML = `✅ 密码已显示: ${passwordInput.value}`;
                        }
                    } else {
                        passwordInput.type = 'password';
                        icon.classList.remove('bi-eye');
                        icon.classList.add('bi-eye-slash');
                        
                        if (targetId === 'realApiKey' && passwordInput.value && !passwordInput.value.includes('***')) {
                            const maskedKey = passwordInput.value.substring(0, 8) + '***';
                            passwordInput.value = maskedKey;
                            console.log(`[DEBUG] API key masked`);
                            logDiv.innerHTML = `✅ API Key已掩码: ${maskedKey}`;
                        } else {
                            logDiv.innerHTML = `✅ 密码已隐藏`;
                        }
                    }
                });
            });
        }
        
        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', () => {
            console.log('页面加载完成，初始化密码切换按钮');
            initTogglePasswordButtons();
        });
    </script>
</body>
</html>
