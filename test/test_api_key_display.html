<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Key Display Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ccc; }
        .debug-info { background: #f5f5f5; padding: 10px; margin: 10px 0; font-family: monospace; }
        .success { color: green; }
        .error { color: red; }
        .info { color: blue; }
    </style>
</head>
<body>
    <h1>API Key显示测试</h1>
    
    <div class="test-section">
        <h2>1. 测试API Key获取</h2>
        <button onclick="testApiKeyFetch()">测试获取API Key</button>
        <div id="api-key-result"></div>
    </div>
    
    <div class="test-section">
        <h2>2. 测试Masked API Key检测</h2>
        <button onclick="testMaskedDetection()">测试Masked检测</button>
        <div id="masked-result"></div>
    </div>
    
    <div class="test-section">
        <h2>3. 调试信息</h2>
        <div id="debug-log"></div>
    </div>

    <script>
        function addLog(message, type = 'info') {
            const div = document.getElementById('debug-log');
            const p = document.createElement('p');
            p.className = type;
            p.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            div.appendChild(p);
        }
        
        async function testApiKeyFetch() {
            const resultDiv = document.getElementById('api-key-result');
            resultDiv.innerHTML = '<div class="info">测试中...</div>';
            addLog('开始测试API Key获取');
            
            try {
                const resp = await fetch('/auth/app-config/raw-secrets');
                if (resp.ok) {
                    const secrets = await resp.json();
                    const platformApiKeys = secrets.platform_api_keys || {};
                    
                    let result = '<div class="success">✅ API Key获取成功</div>';
                    result += '<div class="info">📋 平台API Keys:</div>';
                    
                    Object.entries(platformApiKeys).forEach(([platform, apiKey]) => {
                        const maskedKey = apiKey.substring(0, 8) + '***';
                        result += `<div class="info">- ${platform}: ${maskedKey}</div>`;
                        addLog(`平台 ${platform}: ${maskedKey}`);
                    });
                    
                    resultDiv.innerHTML = result;
                } else {
                    resultDiv.innerHTML = `<div class="error">❌ API Key获取失败: ${resp.status}</div>`;
                    addLog(`API Key获取失败: ${resp.status}`, 'error');
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="error">❌ 测试失败: ${error.message}</div>`;
                addLog(`API Key获取异常: ${error.message}`, 'error');
            }
        }
        
        function testMaskedDetection() {
            const resultDiv = document.getElementById('masked-result');
            resultDiv.innerHTML = '<div class="info">测试中...</div>';
            addLog('开始测试Masked API Key检测');
            
            const testCases = [
                { value: 'sk-12345678***', expected: true, description: '标准masked格式' },
                { value: 'sk-1234567890***', expected: true, description: '长masked格式' },
                { value: 'sk-1234567890', expected: false, description: '未masked格式' },
                { value: '***', expected: true, description: '只有***' },
                { value: '', expected: false, description: '空值' }
            ];
            
            let result = '<div class="info">📋 Masked检测测试结果:</div>';
            
            testCases.forEach((testCase, index) => {
                const isMasked = testCase.value.includes('***');
                const passed = isMasked === testCase.expected;
                const status = passed ? '✅' : '❌';
                const className = passed ? 'success' : 'error';
                
                result += `<div class="${className}">${status} 测试${index + 1}: ${testCase.description} - "${testCase.value}" -> ${isMasked}</div>`;
                addLog(`测试${index + 1}: ${testCase.description} - "${testCase.value}" -> ${isMasked} (期望: ${testCase.expected})`);
            });
            
            resultDiv.innerHTML = result;
        }
        
        // 页面加载时自动运行测试
        window.addEventListener('load', () => {
            addLog('测试页面加载完成');
            testApiKeyFetch();
            testMaskedDetection();
        });
    </script>
</body>
</html>
